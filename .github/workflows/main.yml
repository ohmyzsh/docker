name: Publish Docker images
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
  # Sent by ohmyzsh/ohmyzsh when a release is published; see docs/ci-workflow.md for the sender.
  repository_dispatch:
    types:
      - omz-release

# The workflow only needs repository read access; Docker Hub credentials are supplied separately.
permissions:
  contents: read

# Superseded pull request runs are worth cancelling because a full run is expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Workflow:
#
#   trigger (manual / push to main / pull request / Oh My Zsh release)
#                                |
#                                v
#                +---------------------------------+
#                | prepare                         |
#                | event -> Zsh and OMZ matrices   |
#                +---------------------------------+
#                         |                        |
#                         v                        |
#   +--------------------------------------+       |
#   | zsh                                  |       |
#   | github-builder bake.yml, one call    |       |
#   | per Zsh version, target: zsh         |       |
#   +--------------------------------------+       |
#                    |         |                   |
#                    v         +-------------------+
#   +--------------------------------+   |
#   | omz-latest                     |   v
#   | latest OMZ x every Zsh version |  +--------------------------------+
#   +--------------------------------+  | omz-versions                  |
#                    |                  | historical OMZ x latest Zsh   |
#                    |                  +--------------------------------+
#                    +-------------------+
#                                        v
#                              +--------------------------------+
#                              | update-image-readme            |
#                              | release-only Docker Hub update |
#                              +--------------------------------+
jobs:
  # Reusable workflow `with:` inputs cannot read the `env` context, so every shared value that
  # would otherwise live in a workflow-level `env:` block is published as a job output here.
  prepare:
    name: Prepare build matrices
    # Forks cannot publish and would burn their Actions minutes rebuilding 38 Zsh versions.
    # Skipping this job skips every downstream job; comment it out to test in a fork.
    if: ${{ github.repository == 'ohmyzsh/docker' }}
    runs-on: ubuntu-latest
    outputs:
      zsh_versions: ${{ steps.set.outputs.zsh_versions }}
      omz_versions: ${{ steps.set.outputs.omz_versions }}
      latest_zsh: ${{ steps.set.outputs.latest_zsh }}
      latest_omz: ${{ steps.set.outputs.latest_omz }}
      zsh_image: ${{ steps.set.outputs.zsh_image }}
      omz_image: ${{ steps.set.outputs.omz_image }}
    steps:
      # Audit outbound network destinations because this job calls the public GitHub API.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve versions and matrices
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          LATEST_ZSH: "5.9.2"
          LATEST_OMZ: master
          ZSH_IMAGE: ohmyzsh/zsh
          OMZ_IMAGE: ohmyzsh/ohmyzsh
          DISPATCH_OMZ_TAG: ${{ github.event.client_payload.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Zsh compatibility surface, newest first. Adding an entry here is all that is needed
          # to start publishing a new version.
          all_zsh="$(jq -c . <<'EOF'
          [
            "master",
            "5.9.2", "5.9.1", "5.9",
            "5.8.1", "5.8",
            "5.7.1", "5.7",
            "5.6.2", "5.6.1", "5.6",
            "5.5.1", "5.5",
            "5.4.2", "5.4.1", "5.4",
            "5.3.1", "5.3",
            "5.2",
            "5.1.1", "5.1",
            "5.0.8", "5.0.7", "5.0.6", "5.0.5", "5.0.4",
            "5.0.3", "5.0.2", "5.0.1", "5.0.0",
            "4.3.17", "4.3.16", "4.3.15", "4.3.14",
            "4.3.13", "4.3.12", "4.3.11", "4.3.10"
          ]
          EOF
          )"

          # 4.3.11 keeps the patch and static PCRE backport paths covered on pull requests.
          pr_zsh="$(jq -cn --arg latest "$LATEST_ZSH" '["master", $latest, "4.3.11"]')"

          # The full upstream tag list, so newly published OMZ versions are picked up automatically;
          # pagination prevents older versions from disappearing. `gh api` rejects --slurp together
          # with --jq, so the pages are filtered afterwards.
          all_omz() {
            gh api repos/ohmyzsh/ohmyzsh/tags --paginate --slurp \
              | jq -c '[.[][] | .name] | map(select(. != env.LATEST_OMZ))'
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              zsh_versions="$all_zsh"
              omz_versions="$(all_omz)"
              ;;
            push)
              # The only pushes to main are merged pull requests, and a change to the Dockerfiles —
              # including Dependabot bumping the pinned Debian digest — invalidates every Zsh image
              # rather than just the newest one.
              zsh_versions="$all_zsh"
              omz_versions='[]'
              ;;
            repository_dispatch)
              # A new Oh My Zsh release leaves the Zsh layer beneath it untouched, so only the OMZ
              # images are rebuilt. A payload without a tag falls back to the whole tag list.
              zsh_versions='[]'
              if [ -n "$DISPATCH_OMZ_TAG" ]; then
                omz_versions="$(jq -cn --arg tag "$DISPATCH_OMZ_TAG" '[$tag]')"
              else
                omz_versions="$(all_omz)"
              fi
              ;;
            pull_request)
              zsh_versions="$pr_zsh"
              omz_versions='[]'
              ;;
            *)
              echo "::error ::unhandled event ${EVENT_NAME}"
              exit 1
              ;;
          esac

          {
            echo "zsh_versions=$zsh_versions"
            echo "omz_versions=$omz_versions"
            echo "latest_zsh=$LATEST_ZSH"
            echo "latest_omz=$LATEST_OMZ"
            echo "zsh_image=$ZSH_IMAGE"
            echo "omz_image=$OMZ_IMAGE"
          } >> "$GITHUB_OUTPUT"

  # Build and publish the standalone Zsh images.
  zsh:
    name: Zsh
    needs: prepare
    # An Oh My Zsh release rebuilds nothing below the OMZ layer.
    if: ${{ needs.prepare.outputs.zsh_versions != '[]' }}
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations and cache entries with GitHub OIDC
    strategy:
      # One failing historical Zsh build should not cancel validation of the other versions.
      fail-fast: false
      # Docker Hub's abuse rate limit is per IP subnet and ignores account level, and GitHub-hosted
      # runners share subnets, so unbounded fan-out gets the finalize manifest requests 429ed.
      max-parallel: 6
      matrix:
        zsh-version: ${{ fromJSON(needs.prepare.outputs.zsh_versions) }}
    uses: docker/github-builder/.github/workflows/bake.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      output: image
      target: zsh
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      cache: true
      # Shared with omz-latest so its linked Zsh build is a cache hit instead of a recompile.
      cache-scope: zsh-${{ matrix.zsh-version }}
      job-name-prefix: zsh ${{ matrix.zsh-version }}
      vars: |
        ZSH_VERSION=${{ matrix.zsh-version }}
      meta-images: ${{ needs.prepare.outputs.zsh_image }}
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=${{ matrix.zsh-version }}
        type=raw,value=latest,enable=${{ matrix.zsh-version == needs.prepare.outputs.latest_zsh }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Build the latest OMZ against every supported Zsh version.
  omz-latest:
    name: Oh My Zsh (latest)
    needs:
      - prepare
      - zsh
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 6 # see the zsh job
      matrix:
        zsh-version: ${{ fromJSON(needs.prepare.outputs.zsh_versions) }}
    uses: docker/github-builder/.github/workflows/bake.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      output: image
      target: ohmyzsh
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      cache: true
      cache-scope: zsh-${{ matrix.zsh-version }}
      job-name-prefix: omz ${{ matrix.zsh-version }}
      # Pull requests publish nothing, so LINK_ZSH resolves the base image from the zsh target
      # instead of the registry, letting a pull request validate OMZ against its own Zsh build.
      vars: |
        OMZ_VERSION=${{ needs.prepare.outputs.latest_omz }}
        ZSH_VERSION=${{ matrix.zsh-version }}
        ZSH_BASE_IMAGE=${{ needs.prepare.outputs.zsh_image }}:${{ matrix.zsh-version }}
        LINK_ZSH=${{ github.event_name == 'pull_request' }}
      meta-images: ${{ needs.prepare.outputs.omz_image }}
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=${{ needs.prepare.outputs.latest_omz }}-zsh${{ matrix.zsh-version }}
        type=raw,value=${{ needs.prepare.outputs.latest_omz }},enable=${{ matrix.zsh-version == needs.prepare.outputs.latest_zsh }}
        type=raw,value=latest,enable=${{ matrix.zsh-version == needs.prepare.outputs.latest_zsh }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Build every non-latest OMZ tag against the latest supported Zsh image.
  omz-versions:
    name: Oh My Zsh (versioned)
    # `zsh` is skipped on an Oh My Zsh release, which must not skip this job in turn.
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.omz_versions != '[]' &&
        (needs.zsh.result == 'success' || needs.zsh.result == 'skipped')
      }}
    needs:
      - prepare
      - zsh
    permissions:
      contents: read
      id-token: write
    strategy:
      # Historical OMZ versions are independent and can be built in parallel.
      fail-fast: false
      max-parallel: 6 # see the zsh job
      matrix:
        omz-version: ${{ fromJSON(needs.prepare.outputs.omz_versions) }}
    uses: docker/github-builder/.github/workflows/bake.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      output: image
      target: ohmyzsh
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      cache: true
      cache-scope: omz-${{ matrix.omz-version }}
      job-name-prefix: omz ${{ matrix.omz-version }}
      vars: |
        OMZ_VERSION=${{ matrix.omz-version }}
        ZSH_VERSION=${{ needs.prepare.outputs.latest_zsh }}
        ZSH_BASE_IMAGE=${{ needs.prepare.outputs.zsh_image }}:${{ needs.prepare.outputs.latest_zsh }}
        LINK_ZSH=${{ github.event_name == 'pull_request' }}
      meta-images: ${{ needs.prepare.outputs.omz_image }}
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=${{ matrix.omz-version }}-zsh${{ needs.prepare.outputs.latest_zsh }}
        type=raw,value=${{ matrix.omz-version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Update Docker Hub descriptions only after all publishing jobs succeed.
  update-image-readme:
    needs:
      - prepare
      - zsh
      - omz-latest
      - omz-versions
    runs-on: ubuntu-latest
    # PRs never publish Docker Hub images, so they must not update Docker Hub descriptions. Each
    # event builds a different subset, so any build job may legitimately be skipped.
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        needs.prepare.result == 'success' &&
        (needs.zsh.result == 'success' || needs.zsh.result == 'skipped') &&
        (needs.omz-latest.result == 'success' || needs.omz-latest.result == 'skipped') &&
        (needs.omz-versions.result == 'success' || needs.omz-versions.result == 'skipped')
      }}
    steps:
      # Keep network access auditable for the Docker Hub API call made by the script.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Use the exact workflow revision when updating image documentation.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Each image directory owns its README; missing files are warnings because other images may exist.
      - name: Update image READMEs
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USER }}
          DH_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for image in */Dockerfile; do
            image="$(basename "$(dirname "$image")")"

            if ! test -f "$image/README.md"; then
              echo "::warning ::missing README.md file at /$image"
              continue
            fi

            node .github/scripts/update-image-readme.js "ohmyzsh/$image" "$image/README.md"
          done
